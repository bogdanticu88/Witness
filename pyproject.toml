[project]
name = "witness-appsec"
version = "0.1.0rc1"
description = "Security finding triage and pull-request review for C#/.NET, backed by Roslyn semantic analysis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Mihai Bogdan Ticu" }]
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
witness = "witness.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/witness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["witness"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the semantic helper build",
    "live: needs a live model endpoint",
]
